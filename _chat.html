<button class="chat-fab" type="button" data-chat-open aria-label="Open live chat">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg><span>Chat</span>
</button>
<section class="chat" id="chat" aria-label="Live chat" hidden>
  <header><div><b>{{ S.site_name }}</b><small>Ask us anything</small></div><button type="button" data-chat-close aria-label="Close chat">&times;</button></header>
  <div class="chat-body" id="chatBody" aria-live="polite"></div>
  <div class="chat-quick" id="chatQuick">
    <button type="button">Delivery time?</button><button type="button">Perfumes for men</button><button type="button">Perfumes for women</button><button type="button">How can I pay?</button>
  </div>
  <form class="chat-form" id="chatForm" autocomplete="off">
    <input id="chatInput" maxlength="500" placeholder="Type your message" aria-label="Your message">
    <button class="btn small" type="submit">Send</button>
  </form>
  <div class="chat-foot"><button type="button" class="link" id="chatHuman">Talk to a human</button>{% if wa_hello %}<a href="{{ wa_hello }}" target="_blank" rel="noopener">WhatsApp</a>{% endif %}</div>
</section>
