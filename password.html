{% extends 'admin/base.html' %}
{% block content %}
<h1>Login details</h1>
<form method="post" class="form narrow">
  <input type="hidden" name="_csrf" value="{{ csrf() }}">
  <label>Username <input name="username" value="{{ username }}" autocomplete="username"></label>
  <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
  <label>New password (8+ characters) <input type="password" name="new" required autocomplete="new-password"></label>
  <button class="btn">Update login</button>
</form>
{% endblock %}
